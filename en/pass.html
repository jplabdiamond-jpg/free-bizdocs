<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Activating your day pass | Free BizDoc</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/suite.css?v=20261017d">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#13263b;background:#f6f8fc}
.pw{max-width:560px;margin:0 auto;padding:60px 20px 40px;text-align:center}
.pw .ic{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 18px;background:#eef4ff;font-size:30px}
.pw h1{font-size:clamp(22px,4vw,28px);font-weight:900;margin:0 0 10px;letter-spacing:-.01em}
.pw p{font-size:15px;color:#5a6b7b;line-height:1.8;margin:0 0 10px}
.pw .big{background:linear-gradient(120deg,#0f2f7a,#1766e6);color:#fff;border-radius:16px;padding:22px;margin:22px 0}
.pw .big b{font-size:20px;font-weight:900;display:block;margin-bottom:4px}
.pw .cta{display:inline-flex;align-items:center;gap:8px;background:#1766e6;color:#fff;font-weight:800;text-decoration:none;border-radius:12px;padding:14px 26px;font-size:16px;margin-top:8px;box-shadow:0 12px 26px -10px rgba(23,102,230,.55)}
.pw .sub{font-size:13px;color:#8a97a6;margin-top:18px}
.pw .sp{display:inline-block;width:22px;height:22px;border:3px solid #cfe0f7;border-top-color:#1766e6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pw .err{color:#c0392b}
</style>
</head>
<body>
<main class="pw" id="root">
  <div class="ic"><span class="sp"></span></div>
  <h1>Confirming your payment…</h1>
  <p>This takes just a few seconds. Please hold on.</p>
</main>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
(function(){
  var root=document.getElementById('root');
  var sid=''; try{ sid=new URLSearchParams(location.search).get('session_id')||''; }catch(e){}
  function ok(){
    root.innerHTML='<div class="ic">✅</div><h1>Your day pass is active</h1>'
      +'<div class="big"><b>24 hours, unlimited</b>Download as many document PDFs as you like on this device — no sign-up.</div>'
      +'<p>You can go straight back to creating documents.</p>'
      +'<a class="cta" href="/en/invoice">Create a document →</a>'
      +'<div class="sub">The pass is valid on this device (browser) for 24 hours. Clearing cookies ends it.</div>';
  }
  function fail(msg){
    root.innerHTML='<div class="ic">⚠️</div><h1 class="err">We couldn’t confirm it yet</h1>'
      +'<p>'+esc(msg||'Confirming your payment is taking a little longer than usual.')+'</p>'
      +'<p>If your payment went through, it should apply within a few minutes. Reopen this page shortly, or '
      +'<a href="/en/contact">contact us</a>.</p>'
      +'<a class="cta" href="/en/invoice">Back to the free tool →</a>';
  }
  if(!sid){ fail('No session information was found.'); return; }
  var tries=0, max=12;
  function poll(){
    tries++;
    fetch('/api/pass/claim?session_id='+encodeURIComponent(sid),{credentials:'same-origin'})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.ok){ ok(); return; }
        if(tries>=max){ fail(); return; }
        setTimeout(poll, 2000);
      })
      .catch(function(){ if(tries>=max){ fail(); } else { setTimeout(poll,2000); } });
  }
  poll();
})();
</script>
<script src="/en/siteheader-en.js?v=20261027t"></script>
</body>
</html>
