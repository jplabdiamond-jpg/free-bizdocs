<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダッシュボード｜Free BizDoc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
body{margin:0}
.app{--ink:#171a21;--bg:#f6f6f2;--surf:#fff;--surf2:#fbfaf7;--mut:#6c6f78;--faint:#9a9ca3;--bd:#e6e4dd;--ac:#1766e6;--ac-s:#e7effb;--good:#157a48;--good-s:#dcefe4;--warn:#9c6b15;--warn-s:#f3e8cf;--over:#b23a2c;--over-s:#f2dcd7;
font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-wrap:wrap;width:100%;min-height:100vh;box-sizing:border-box}
.side{width:236px;background:var(--surf);border-right:1px solid var(--bd);padding:22px 16px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px}.brand img{height:28px;width:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lb{font-size:10px;letter-spacing:.1em;color:var(--faint);font-weight:700;margin:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--mut);text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:var(--surf2);color:var(--ink)}
.nav a.on{background:var(--ac-s);color:var(--ac);font-weight:700}
.nav a .ic,.logout .ic{width:17px;height:17px;flex:none}
.side .sp{flex:1}
.logout{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--mut);background:none;border:none;font-family:inherit;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.logout:hover{background:var(--surf2);color:var(--ink)}
.main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column}
.top{min-height:62px;border-bottom:1px solid var(--bd);background:var(--surf);display:flex;align-items:center;gap:12px;padding:10px 26px;box-sizing:border-box;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-weight:700}.top .sp{flex:1}
.who{font-size:12.5px;color:var(--mut)}
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:9px;padding:9px 15px;border:1px solid var(--bd);background:var(--surf);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:#1257ca}
.wrap{padding:24px 26px;display:flex;flex-direction:column;gap:18px;max-width:1000px}
.planbox{background:linear-gradient(120deg,#0f2f7a,#1766e6);color:#fff;border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 16px 40px -22px rgba(23,102,230,.5)}
.planbox .pl-t{font-size:13px;opacity:.9}.planbox .pl-n{font-size:20px;font-weight:900;margin:2px 0}
.planbox .bar{height:8px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden;margin-top:8px;max-width:280px}
.planbox .bar>i{display:block;height:100%;background:#fff;border-radius:999px}
.planbox .pl-u{font-size:12.5px;opacity:.95;margin-top:6px}
.planbox .sp{flex:1}
.planbox .up{background:#fff;color:#1256cf;font-weight:800;border:none;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
.kpi .k{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:23px;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.kpi.over .v{color:var(--over)}
.panel{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:4px 0}
.panel h2{font-size:14px;font-weight:800;margin:0;padding:14px 18px;border-bottom:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 18px;border-bottom:1px solid var(--bd)}
th{font-size:11px;color:var(--faint);font-weight:700}
tr:last-child td{border-bottom:none}
.st{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.st.pending{background:var(--warn-s);color:var(--warn)}.st.paid{background:var(--good-s);color:var(--good)}
.st.partial{background:var(--ac-s);color:var(--ac)}.st.overdue{background:var(--over-s);color:var(--over)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:10px;flex-wrap:wrap}
/* FREE向け: PRO機能の発見カード */
.pteaser{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:18px 20px}
.pteaser .ph{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;margin:0}
.pteaser .ph .bd{font-size:10px;font-weight:900;color:#9c6b15;background:#f6ecd2;border-radius:999px;padding:2px 8px}
.pteaser .psub{font-size:12.5px;color:var(--mut);margin:5px 0 15px;line-height:1.6}
.pteaser .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.pteaser .f{border:1px solid var(--bd);border-radius:11px;padding:13px 14px;background:var(--surf2)}
.pteaser .f .ic{width:21px;height:21px;color:var(--ac);display:block;margin-bottom:7px}
.pteaser .f .ft{font-size:13px;font-weight:800}
.pteaser .f .fd{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.55}
.pteaser .cta{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(120deg,#1766e6,#2f9bf0);color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:11px 19px;border-radius:11px;box-shadow:0 10px 24px -10px rgba(23,102,230,.5)}
@media(max-width:620px){.pteaser .grid{grid-template-columns:1fr}}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}.side .sp{display:none}.nav{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/logo.png?v=20261021" alt="Free BizDoc"></div>
    <nav class="nav">
      <a class="on" href="/dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>ダッシュボード</a>
      <div class="lb">書類</div>
      <a href="/invoice-list"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>請求書</a>
      <a href="/quotes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H4z"/><path d="M8 20h8"/></svg>見積書</a>
      <a href="/recurring"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>定期請求</a>
      <div class="lb">お金</div>
      <a href="/payments"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>入金管理</a>
      <a href="/reports"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>レポート</a>
    </nav>
    <div class="sp"></div>
    <button class="logout" id="logout"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>ログアウト</button>
  </aside>
  <div class="main">
    <header class="top">
      <h1>ダッシュボード</h1>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <a class="btn pri" href="/invoice-create"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>請求書を作成</a>
    </header>
    <div class="wrap">
      <div class="planbox" id="planbox"></div>
      <div class="kpis" id="kpis"></div>
      <div class="panel"><h2>直近の請求書</h2><table><thead><tr><th>番号</th><th>取引先</th><th>発行日</th><th>状態</th><th class="n">金額</th></tr></thead><tbody id="recent"><tr><td colspan="5" style="color:var(--faint)">読み込み中…</td></tr></tbody></table></div>
      <div id="proteaser"></div>
    </div>
  </div>
</div>
<script src="/api.js?v=20261027a"></script>
<script>
function stTag(r){ if(r.overdue) return '<span class="st overdue">期限超過</span>'; var m={pending:'未入金',paid:'入金済',partial:'一部入金',draft:'下書き'}; return '<span class="st '+(r.status||'pending')+'">'+(m[r.status]||r.status)+'</span>'; }
(async function(){
  try{
    var me=await (await fetch('/api/auth/me')).json();
    if(!me.authed){ location.href='/login'; return; }
    document.getElementById('who').textContent=me.email||'';
    var pb=document.getElementById('planbox');
    if(me.plan==='pro'){
      pb.innerHTML='<div><div class="pl-t">現在のプラン</div><div class="pl-n">PRO プラン</div><div class="pl-u">書類の保存は無制限です。</div></div>';
    }else{
      var used=me.doc_count||0, lim=me.limit||5, pct=Math.min(100,Math.round(used/lim*100));
      pb.innerHTML='<div><div class="pl-t">現在のプラン</div><div class="pl-n">無料プラン</div>'
        +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
        +'<div class="pl-u">書類の保存 '+used+' / '+lim+' 件'+(me.remaining<=0?'（上限に達しています）':'（あと'+me.remaining+'件）')+'</div></div>'
        +'<div class="sp"></div><a class="up" href="/pricing">PROにアップグレード →</a>';
      renderProTeaser();
    }
    var d=await API.get('/api/dashboard');
    document.getElementById('kpis').innerHTML=
       kpi('今月の請求額', API.yen(d.month_amount), d.month_count+' 件')
      +kpi('未入金（売掛）', API.yen(d.unpaid_amount), d.unpaid_count+' 件')
      +kpi('期限超過', API.yen(d.overdue_amount), d.overdue_count+' 件', true)
      +kpi('今月の入金', API.yen(d.paid_amount), '');
    var rows=(d.recent||[]);
    document.getElementById('recent').innerHTML = rows.length ? rows.map(function(r){
      return '<tr><td>'+API.esc(r.doc_no||'下書き')+'</td><td>'+API.esc(r.client_name||'—')+'</td><td>'+API.esc(r.issue_date||'')+'</td><td>'+stTag(r)+'</td><td class="n">'+API.yen(r.payable)+'</td></tr>';
    }).join('') : '<tr><td colspan="5" style="color:var(--faint)">まだ請求書がありません。「請求書を作成」から始めましょう。</td></tr>';
  }catch(e){ document.getElementById('recent').innerHTML='<tr><td colspan="5" style="color:var(--over)">読み込みエラー: '+API.esc(e.message)+'</td></tr>'; }
})();
function kpi(k,v,s,over){ return '<div class="kpi'+(over?' over':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+(s||'')+'</div></div>'; }
function renderProTeaser(){
  var el=document.getElementById('proteaser'); if(!el) return;
  function f(ic,t,d){ return '<div class="f">'+ic+'<div class="ft">'+t+'</div><div class="fd">'+d+'</div></div>'; }
  var icRec='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>';
  var icPay='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>';
  var icRep='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';
  el.className='pteaser';
  el.innerHTML=''
    +'<div class="ph"><span class="bd">PRO</span>保存だけじゃない、こんな機能も</div>'
    +'<div class="psub">発行して終わりにせず、入金まで管理できます。繰り返す請求は自動化、売掛はひと目で。</div>'
    +'<div class="grid">'
    + f(icRec,'定期請求の自動作成','顧問料・保守費など毎月の請求を自動で発行。')
    + f(icPay,'入金管理・消込','未入金・期限超過を自動で見える化、回収もれを防止。')
    + f(icRep,'売上レポート','月次・取引先別に集計。確定申告の準備にも。')
    +'</div>'
    +'<a class="cta" href="/pricing"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>PROにアップグレード（月¥2,000）→</a>';
}
document.getElementById('logout').addEventListener('click',function(){ API.logout(); });
</script>
<script src="/appshell.js?v=20261027"></script>
</body>
</html>
