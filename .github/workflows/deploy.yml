name: deploy-site

# main への push で本番 Cloudflare Pages へ即デプロイする。
# （記事の自動公開は auto-publish.yml が担当。こちらはコード/デザイン変更の反映用。）
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7969ecaa0a1b9bacae1861547c2ec3fe"
        run: npx --yes wrangler@3 pages deploy . --project-name=seikyu-hub-demo --branch=main --commit-dirty=true
