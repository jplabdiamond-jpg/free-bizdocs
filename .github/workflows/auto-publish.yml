name: auto-publish-blog

on:
  schedule:
    # UTC 00:00-13:00 = JST 09:00-22:00（30分毎）。スロット判定で実際の公開時刻をランダム分散する。
    - cron: '*/30 0-13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto（スロット判定）または force（今すぐ次の1本を公開＝テスト用）'
        default: 'auto'
        required: false

concurrency:
  group: auto-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webp (cwebp)
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Decide & stage next article
        env:
          PUBLISH_MODE: ${{ github.event.inputs.mode }}
        run: node scripts/publish.mjs

      - name: Read result
        id: res
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('publish-result.json','utf8'));console.log('published='+(r.published?'yes':'no'));console.log('slug='+(r.slug||''));console.log('reason='+(r.reason||''));" >> "$GITHUB_OUTPUT"
          echo "---- result ----"; cat publish-result.json

      - name: Deploy to Cloudflare Pages
        if: steps.res.outputs.published == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7969ecaa0a1b9bacae1861547c2ec3fe"
        run: npx --yes wrangler@3 pages deploy . --project-name=seikyu-hub-demo --branch=main --commit-dirty=true

      - name: Commit & push state
        if: steps.res.outputs.published == 'yes'
        run: |
          rm -f publish-result.json
          git config user.name "free-bizdocs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "auto-publish: ${{ steps.res.outputs.slug }}"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: IndexNow ping
        if: steps.res.outputs.published == 'yes'
        run: |
          node -e '
          const https=require("https");
          const slug=process.env.SLUG;
          const key="a443fe2d01c64cdaa0d1e4a37a44edb3aac13d4e7e36461ab60734c6ac1bb773";
          const body=JSON.stringify({host:"free-bizdocs.com",key,keyLocation:`https://free-bizdocs.com/${key}.txt`,urlList:[`https://free-bizdocs.com/blog/${slug}`,"https://free-bizdocs.com/blog"]});
          const req=https.request("https://api.indexnow.org/indexnow",{method:"POST",headers:{"Content-Type":"application/json; charset=utf-8"}},r=>{console.log("IndexNow status",r.statusCode);r.resume();});
          req.on("error",e=>console.log("IndexNow error",e.message));
          req.write(body);req.end();
          '
        env:
          SLUG: ${{ steps.res.outputs.slug }}

      - name: Summary
        if: always()
        run: |
          echo "published=${{ steps.res.outputs.published }}  slug=${{ steps.res.outputs.slug }}  reason=${{ steps.res.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
