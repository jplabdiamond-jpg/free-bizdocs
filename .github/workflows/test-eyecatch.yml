name: test-eyecatch
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pillow
      - name: Generate samples
        run: |
          mkdir -p _samples
          python3 scripts/gen-eyecatch.py sample-invoice "フリーランスの請求書の書き方｜源泉徴収ありの記載例つき" "請求書" _samples/sample-invoice.webp '{"emph":"請求書","emphcolor":"#ffd400","en":"How to Invoice as a Freelancer"}'
          python3 scripts/gen-eyecatch.py sample-receipt "領収書の宛名「上様」はOK？正しい書き方と注意点" "領収書" _samples/sample-receipt.webp '{"emph":"上様","emphcolor":"#ff4b4b","en":"Can You Address a Receipt to Uesama?"}'
          python3 scripts/gen-eyecatch.py sample-quote "見積書の有効期限の書き方と記載例" "見積書" _samples/sample-quote.webp '{"emph":"有効期限"}'
          python3 scripts/gen-eyecatch.py sample-resume "履歴書の写真のサイズとルール" "履歴書" _samples/sample-resume.webp '{"emph":"写真","emphcolor":"#ff7a3c","en":"Resume Photo Size and Rules"}'
          ls -la _samples
      - uses: actions/upload-artifact@v4
        with:
          name: eyecatch-samples
          path: _samples/*.webp
