<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>1日パスを有効化｜Free BizDoc</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/landing.css?v=20261016c">
<style>
.pw{max-width:560px;margin:0 auto;padding:60px 20px 40px;text-align:center}
.pw .ic{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 18px;background:#eef4ff}
.pw h1{font-size:clamp(22px,4vw,28px);font-weight:900;margin:0 0 10px;letter-spacing:-.01em}
.pw p{font-size:15px;color:var(--mut);line-height:1.8;margin:0 0 10px}
.pw .big{background:linear-gradient(120deg,#0f2f7a,#1766e6);color:#fff;border-radius:16px;padding:22px;margin:22px 0}
.pw .big b{font-size:20px;font-weight:900;display:block}
.pw .cta{display:inline-flex;align-items:center;gap:8px;background:var(--ac,#1766e6);color:#fff;font-weight:800;text-decoration:none;border-radius:12px;padding:14px 26px;font-size:16px;margin-top:8px;box-shadow:0 12px 26px -10px rgba(23,102,230,.55)}
.pw .sub{font-size:13px;color:#8a97a6;margin-top:18px}
.pw .sp{display:inline-block;width:22px;height:22px;border:3px solid #cfe0f7;border-top-color:#1766e6;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-5px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.pw .err{color:#c0392b}
</style>
</head>
<body>
<main class="pw" id="root">
  <div class="ic"><span class="sp"></span></div>
  <h1>お支払いを確認しています…</h1>
  <p>数秒で有効化されます。このまま少しお待ちください。</p>
</main>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
(function(){
  var root=document.getElementById('root');
  var sid=''; try{ sid=new URLSearchParams(location.search).get('session_id')||''; }catch(e){}
  function ok(){
    root.innerHTML='<div class="ic">✅</div><h1>1日パスが有効になりました</h1>'
      +'<div class="big"><b>24時間 使い放題</b>この端末で、書類PDFを無制限にダウンロードできます（登録不要）。</div>'
      +'<p>そのまま書類づくりに戻れます。</p>'
      +'<a class="cta" href="/invoice">書類を作る →</a>'
      +'<div class="sub">※ パスはこの端末（ブラウザ）で24時間有効です。Cookieを消すと無効になります。</div>';
  }
  function fail(msg){
    root.innerHTML='<div class="ic">⚠️</div><h1 class="err">確認できませんでした</h1>'
      +'<p>'+esc(msg||'お支払いの確認に時間がかかっています。')+'</p>'
      +'<p>決済が完了していれば数分以内に反映されます。しばらくして再度このページを開くか、'
      +'<a href="/contact">お問い合わせ</a>ください。</p>'
      +'<a class="cta" href="/invoice">無料ツールに戻る →</a>';
  }
  if(!sid){ fail('セッション情報が見つかりませんでした。'); return; }
  var tries=0, max=12;
  function poll(){
    tries++;
    fetch('/api/pass/claim?session_id='+encodeURIComponent(sid),{credentials:'same-origin'})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.ok){ ok(); return; }
        if(tries>=max){ fail(); return; }
        setTimeout(poll, 2000);
      })
      .catch(function(){ if(tries>=max){ fail(); } else { setTimeout(poll,2000); } });
  }
  poll();
})();
</script>
<script src="/siteheader.js?v=20261019en"></script>
</body>
</html>
