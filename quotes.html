<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見積書一覧｜Free BizDoc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
body{margin:0}
.app{--ink:#171a21;--bg:#f6f6f2;--surf:#ffffff;--surf2:#fbfaf7;--mut:#6c6f78;--faint:#9a9ca3;--bd:#e6e4dd;--ac:#3a46a8;--ac-s:#e7e8f6;--good:#157a48;--good-s:#dcefe4;--warn:#9c6b15;--warn-s:#f3e8cf;--over:#b23a2c;--over-s:#f2dcd7;
font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-wrap:wrap;width:100%;min-height:100vh;box-sizing:border-box}
.side{width:236px;background:var(--surf);border-right:1px solid var(--bd);padding:22px 16px;display:flex;flex-direction:column;gap:22px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px}
.brand .pl{font-size:10px;font-weight:700;color:var(--ac);background:var(--ac-s);padding:2px 7px;border-radius:5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lb{font-size:10px;letter-spacing:.1em;color:var(--faint);font-weight:700;margin:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--mut);text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:var(--surf2);color:var(--ink)}
.nav a.on{background:var(--ac-s);color:var(--ac);font-weight:700}
.nav a .ic{width:17px;height:17px;flex:none}
.main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column}
.top{min-height:62px;border-bottom:1px solid var(--bd);background:var(--surf);display:flex;align-items:center;gap:12px;padding:10px 26px;box-sizing:border-box;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:700}.top .sp{flex:1}
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:9px;padding:9px 15px;border:1px solid var(--bd);background:var(--surf);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:#30399a}
.content{padding:22px 26px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tabs button{font-family:inherit;font-size:13.5px;font-weight:700;border:none;background:none;color:var(--mut);padding:10px 15px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.tabs .ct{font-size:11px;background:var(--surf2);color:var(--faint);border-radius:999px;padding:1px 7px;margin-left:5px}
.tabs button.on .ct{background:var(--ac-s);color:var(--ac)}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:13px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.04em;color:var(--faint);font-weight:700;padding:12px 10px;border-bottom:1px solid var(--bd);background:var(--surf2)}
td{padding:12px 10px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surf2)}
td.n{font-variant-numeric:tabular-nums;text-align:right}
td .no{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.sent{background:var(--good-s);color:var(--good)}.pill.draft{background:#eceae4;color:var(--mut)}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.ib{border:1px solid var(--bd);background:var(--surf);border-radius:7px;padding:5px 11px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;color:var(--ac);cursor:pointer}
.ib:hover{border-color:var(--ac);background:var(--ac-s)}
.muted{color:var(--faint);font-size:13px;padding:26px;text-align:center}
@media(max-width:860px){.hideS{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/logo.png?v=20261021" alt="Free BizDoc" style="height:30px;width:auto;display:block"><span class="pl">PRO</span></div>
    <nav class="nav">
      <a href="/dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>ダッシュボード</a>
      <div class="lb">書類</div>
      <a href="/invoice-list"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>請求書</a>
      <a class="on" href="/quotes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H4z"/><path d="M8 20h8"/></svg>見積書</a>
      <a href="/recurring"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>定期請求</a>
      <div class="lb">お金</div>
      <a href="/payments"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>入金管理</a>
      <a href="/reports"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>レポート</a>
    </nav>
  </aside>
  <div class="main">
    <header class="top">
      <h1>見積書</h1><span class="sp"></span>
      <a class="btn pri" href="/invoice-create"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>見積書を作成</a>
    </header>
    <div class="content">
      <div class="tabs" id="tabs">
        <button class="on" data-tab="all">すべて<span class="ct" id="c-all">0</span></button>
        <button data-tab="draft">下書き<span class="ct" id="c-draft">0</span></button>
        <button data-tab="pending">送付済み<span class="ct" id="c-pending">0</span></button>
      </div>
      <div class="card">
        <table>
          <thead><tr>
            <th>番号</th><th>取引先</th><th class="hideS">発行日</th><th class="hideS">有効期限</th><th style="text-align:right">金額（税込）</th><th>状態</th><th style="width:140px"></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="muted">読み込み中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="/api.js?v=20261027b"></script>
<script>
var all=[], cur='all';
function pill(r){ return r.status==='draft' ? '<span class="pill draft">下書き</span>' : '<span class="pill sent">送付済み</span>'; }
function match(r,t){ return t==='all'?true:r.status===t; }
function render(){
  var list=all.filter(function(r){return match(r,cur);});
  var tb=document.getElementById('rows');
  if(!list.length){ tb.innerHTML='<tr><td colspan="7" class="muted">まだ見積書がありません。「見積書を作成」から始めましょう。</td></tr>'; return; }
  tb.innerHTML=list.map(function(r){
    var _e='<a class="ib" href="/quote?doc='+r.id+'">編集</a>';
    var act = r.status==='draft'
      ? '<div class="rowact">'+_e+'<span style="color:var(--faint);font-size:11.5px">下書き</span></div>'
      : '<div class="rowact">'+_e+'<button class="ib" data-conv="'+r.id+'">請求書に変換 →</button></div>';
    return '<tr data-id="'+r.id+'"><td><span class="no">'+API.esc(r.doc_no||'（下書き）')+'</span></td>'
      +'<td>'+API.esc(r.client_name||'—')+'</td>'
      +'<td class="hideS">'+API.esc(r.issue_date||'—')+'</td>'
      +'<td class="hideS">'+API.esc(r.due_date||'—')+'</td>'
      +'<td class="n">'+API.yen(r.total)+'</td>'
      +'<td>'+pill(r)+'</td><td>'+act+'</td></tr>';
  }).join('');
}
function counts(){
  var c={all:all.length,draft:0,pending:0};
  all.forEach(function(r){ if(r.status==='draft')c.draft++; else c.pending++; });
  ['all','draft','pending'].forEach(function(k){ document.getElementById('c-'+k).textContent=c[k]; });
}
document.getElementById('tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return;
  Array.prototype.forEach.call(this.children,function(x){x.classList.remove('on');}); b.classList.add('on'); cur=b.getAttribute('data-tab'); render(); });
document.getElementById('rows').addEventListener('click',async function(e){
  var c=e.target.closest('[data-conv]'); if(!c)return;
  var id=c.getAttribute('data-conv'); c.disabled=true; var old=c.textContent; c.textContent='変換中…';
  try{
    var d=await API.get('/api/documents/'+id);
    var items=(d.items||[]).map(function(it){return {name:it.name,qty:it.qty,unit:it.unit,unit_price:it.unit_price,tax_rate:it.tax_rate,withholding:it.withholding};});
    var due=new Date(Date.now()+1000*60*60*24*30).toISOString().slice(0,10);
    await API.post('/api/documents',{type:'invoice',status:'pending',client_id:d.document.client_id,bank:d.document.bank,notes:d.document.notes,source_doc_id:Number(id),due_date:due,items:items});
    location.href='/invoice-list';
  }catch(err){
    c.disabled=false; c.textContent=old;
    if(err&&err.status===403&&err.data&&err.data.upsell){ if(window.fbShowModal) window.fbShowModal(); else alert(err.message); }
    else alert('変換に失敗しました: '+err.message);
  }
});
(async function(){
  try{ var r=await API.get('/api/documents?type=quote&status=all'); all=r.documents||[]; counts(); render(); }
  catch(e){ document.getElementById('rows').innerHTML='<tr><td colspan="7" class="muted">読み込み失敗: '+API.esc(e.message)+'</td></tr>'; }
})();
</script>
<script src="/appshell.js?v=20261027"></script>
</body>
</html>
